services:
  db:
    image: mariadb:11
    container_name: monosites-lexington116-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: lexington116
      MARIADB_USER: lexington116
      MARIADB_PASSWORD: lexington116
      MARIADB_ROOT_PASSWORD: root
    # Local database, available to GUI clients on loopback only.
    ports:
      - "127.0.0.1:8401:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monosites-lexington116
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8400:80"
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: lexington116
      WORDPRESS_DB_USER: lexington116
      WORDPRESS_DB_PASSWORD: lexington116
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DB_CHARSET: utf8mb4
      WORDPRESS_DB_COLLATE: ""
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        // Keep the local site URL independent of any future production database.
        define( 'WP_HOME', 'http://localhost:8400' );
        define( 'WP_SITEURL', 'http://localhost:8400' );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_DEFAULT_THEME', 'lexington116_2026' );
    volumes:
      - wp-core:/var/www/html
      - ./wp-content:/var/www/html/wp-content

    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/wp-config.php') && is_file('/var/www/html/wp-includes/version.php') ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    container_name: monosites-lexington116-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8402:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Local-only database with local-only credentials, so it signs itself in.
      PMA_USER: lexington116
      PMA_PASSWORD: lexington116
      # Allow local database imports through the browser.
      UPLOAD_LIMIT: 512M

  wpcli:
    image: wordpress:cli-php8.2
    container_name: monosites-lexington116-cli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment: *wordpress-environment
    volumes:
      - wp-core:/var/www/html
      - ./wp-content:/var/www/html/wp-content
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  wp-core:
  db-data:
