services:
  db:
    image: mariadb:11
    container_name: monosites-deyutcm-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: deyutcm
      MARIADB_USER: deyutcm
      MARIADB_PASSWORD: deyutcm
      MARIADB_ROOT_PASSWORD: root
    # 3307-3309 are already used by other local containers; 3310 is free.
    # Published so a GUI client (Sequel Ace, TablePlus, phpMyAdmin) can reach it.
    ports:
      - "3310:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monosites-deyutcm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8300:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: deyutcm
      WORDPRESS_DB_USER: deyutcm
      WORDPRESS_DB_PASSWORD: deyutcm
      WORDPRESS_TABLE_PREFIX: wp_
      # Matches the prod schema: utf8, not the image's utf8mb4 default.
      WORDPRESS_DB_CHARSET: utf8
      WORDPRESS_DB_COLLATE: ""
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        // The imported prod database holds the live domain in siteurl/home.
        // These constants override it so the copy serves on localhost, without
        // writing anything back to the database.
        define( 'WP_HOME', 'http://localhost:8300' );
        define( 'WP_SITEURL', 'http://localhost:8300' );
        define( 'FS_METHOD', 'direct' );
    volumes:
      - wp-core:/var/www/html
      - ./wp-content:/var/www/html/wp-content

  wpcli:
    image: wordpress:cli-php8.2
    container_name: monosites-deyutcm-cli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: deyutcm
      WORDPRESS_DB_USER: deyutcm
      WORDPRESS_DB_PASSWORD: deyutcm
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DB_CHARSET: utf8
      WORDPRESS_DB_COLLATE: ""
    volumes:
      - wp-core:/var/www/html
      - ./wp-content:/var/www/html/wp-content
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  wp-core:
  db-data:
